kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: "nssf-build-cfg"
spec:
    runPolicy: "Serial"
    source:
        type: "Binary"
    strategy:
        dockerStrategy:
            dockerfilePath: "docker/Dockerfile.nssf.centos"
    output:
        to:
            kind: "ImageStreamTag"
            name: "oai-nssf:latest"
