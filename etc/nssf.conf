NSSF =
{
    INSTANCE_ID   = @INSTANCE@;
    PID_DIRECTORY = "@PID_DIRECTORY@";

    NSSF_NAME = "@NSSF_NAME@";
    FQDN      = "@NSSF_FQDN@";

    INTERFACES :
    {
        SBI: # NSSF binded interface for SBI interface (e.g., communication with AMF, NSSF, NRF)
        {
            INTERFACE_NAME         = "@SBI_IF_NAME@";  # STRING, interface name, YOUR NETWORK CONFIG HERE
            IPV4_ADDRESS           = "read";                                    # STRING, CIDR or "read to let app read interface configured IP address
            PORT                   = @SBI_PORT@;                                # Default is 80
        };
    };

    SUPPORTED_FEATURES:  
    {
       HTTP_VERSION = @HTTP_VERSION@;    # Set HTTP version; Accepted values - 1 or 2 (default: 1)
       # STRING, {"yes", "no"},
       REGISTER_NRF = "@REGISTER_NRF@";  # Set to 'yes' if NSSF resgisters to an NRF
       USE_FQDN     = "@USE_FQDN@";      # Set to 'yes' if NSSF resolves services by FQDN

        NRF :
        {
            IPV4_ADDRESS = "@NRF_IPV4_ADDRESS@";  # YOUR NRF IPv4 HERE
            PORT         =  @NRF_PORT@;           # YOUR NRF PORT HERE (default: 80)
            HTTP_VERSION =  @HTTP_VERSION@;       # YOUR NRF HTTP VERSION (1 or 2 default 1)
            API_VERSION  = "@NRF_API_VERSION@";   # YOUR NRF API VERSION HERE
            FQDN         = "@NRF_FQDN@";          # YOUR NRF FQDN HERE
        };
    }
};

