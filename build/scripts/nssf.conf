NSSF =
{
    INSTANCE_ID   = 0;
    PID_DIRECTORY = "/var/run";

    NSSF_NAME = "oai-nssf";
    FQDN      = "nssf.oai-5gc.eur";

    INTERFACES :
    {
        SBI: # NSSF binded interface for SBI interface (e.g., communication with AMF, NSSF, NRF)
        {
            INTERFACE_NAME         = "eth0";  # STRING, interface name, YOUR NETWORK CONFIG HERE
            IPV4_ADDRESS           = "read";  # STRING, CIDR or "read to let app read interface configured IP address
            PORT                   = 80;      # Default is 80
        };
    };

    SUPPORTED_FEATURES:  
    {
       # STRING, {"yes", "no"},
       REGISTER_NRF  = "yes";  # Set to 'yes' if NSSF resgisters to an NRF
       USE_FQDN      = "no";   # Set to 'yes' if host to be resolved with FQDN  
       HTTP_VERSION  = 1;       # Default is 1.1
        NRF :
        {
            IPV4_ADDRESS = "192.168.70.130";       # YOUR NRF IPv4 HERE
            PORT         =  80;                    # YOUR NRF PORT HERE (default: 80)
            API_VERSION  = "v1";                   # YOUR NRF API VERSION HERE
            FQDN         = "nrf.oai-5gc.eur";      # YOUR NRF FQDN HERE
        };
    }
};

